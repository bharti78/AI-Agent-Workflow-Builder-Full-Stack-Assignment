table:
  schema: public
  name: step_runs

object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id

# ---------------------------------------------------------------------------
# This is the table the frontend's live-execution GraphQL subscription
# (section 19 / Phase 11) reads from. The filter below is what guarantees
# "the subscriber cannot use the subscription to access another
# organization's data" — Hasura re-evaluates this filter on every
# subscription tick, not just at subscribe time, so it can't be bypassed
# by holding a long-lived subscription open across a role change either.
#
# No insert/update/delete for role "user": approval happens exclusively
# through the `approveStep` Action (Phase 10/15), which performs the full
# 8-point check list from section 15 before touching this table.
# ---------------------------------------------------------------------------
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - started_at
        - completed_at
        - approved_by
        - approved_at
        - created_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
